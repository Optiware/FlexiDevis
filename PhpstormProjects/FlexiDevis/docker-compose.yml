version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: flexidevis_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: FlexiDevis
    volumes:
      - flexidevis_mysql_data:/var/lib/mysql

volumes:
  flexidevis_mysql_data:
